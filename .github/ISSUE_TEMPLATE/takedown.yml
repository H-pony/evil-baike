# ============================================================
# 下架 / 申诉 · Issue 表单
# ============================================================
# 自动添加 label: takedown
# 用于当事人 / 代理人因事实错误、身份混淆、未成年人保护、隐私侵权等原因申请下架某条目。
# 主编会私下核实身份并评估。

name: 下架 / 申诉
description: 当事人 / 代理人申请下架某条目；此 Issue 公开，请勿提交身份证件或其他敏感资料。
title: "[下架] "
labels:
  - takedown

body:
  - type: markdown
    attributes:
      value: |
        > 🔒 **隐私提醒**
        > - 本表单提交后会成为公开 GitHub Issue，所有字段和评论均可被公众看到。
        > - 请勿填写身份证件、住址、电话、健康信息或其他敏感资料。
        > - 如需核验身份，请先只描述不涉及隐私的申诉理由，等待维护者提供安全的核验方式。
        > - 主编会在 **14 个自然日内**响应。

  - type: dropdown
    id: entry-type
    attributes:
      label: 条目类型
      options:
        - event
        - person
        - organization
    validations:
      required: true

  - type: input
    id: entry-id
    attributes:
      label: 条目 ID
      description: 详情页 URL 的最后一段（kebab-case）。
    validations:
      required: true

  - type: dropdown
    id: reason
    attributes:
      label: 申诉理由
      options:
        - 事实错误（关键事实失实）
        - 身份混淆（被错误等同于他人）
        - 未成年人保护
        - 隐私侵权（含可识别家庭住址 / 联系方式 / 健康信息）
        - 已和解 / 已撤案 / 已纠正（事件本身不再有公共讨论价值）
        - 司法定罪已撤销
        - 其他（请在说明栏写明）
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 详情说明
      description: 说明事件经过、错误位置、希望的处理方式（整条下架 / 部分更正 / 匿名化）。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我是当事人本人或经书面授权的代理人。
          required: true
        - label: 我理解主编会在 14 个自然日内处理；处理结果可能为：维持原状 / 部分修订 / 整条下架。
          required: true
