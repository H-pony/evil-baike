# ============================================================
# 新事件投稿 · Issue 表单
# ============================================================
# 自动添加 label: submission（CI 每日同步脚本以此筛选）
# name 决定在 New Issue 选择页显示的标题

name: 新事件投稿
description: 提交一个尚未收录的公共事件，必须附至少 2 条信源。
title: "[新事件投稿] "
labels:
  - submission

body:
  - type: markdown
    attributes:
      value: |
        > 📚 **投稿前必读**
        > - 必须附 **至少 2 条** 一级 / 二级信源（官方文件 / 主流媒体 / 公开裁判文书）
        > - 仅汇总事实，不写"恶人""罪犯"等定性词
        > - 涉未审结案件时使用"涉嫌""据报道"等措辞
        > - 详见 [CONTRIBUTING.md](https://github.com/H-pony/evil-baike/blob/main/docs/CONTRIBUTING.md)

  - type: input
    id: event-title
    attributes:
      label: 事件标题（一句话）
      description: 用一句话描述事件，避免使用主观定性词。
      placeholder: 例如：XX 公司 2024 年期间被曝财务造假
    validations:
      required: true
      max_length: 120

  - type: dropdown
    id: event-type
    attributes:
      label: 事件类型
      options:
          - criminal         # 刑事案件
          - legal            # 民事/行政诉讼
          - corporate        # 企业丑闻
          - controversy      # 公共争议事件
          - public-safety    # 公共安全事件
          - moral            # 道德层面
          - human-rights     # 人权事件
          - media            # 媒体争议
    validations:
      required: true

  - type: input
    id: date-range
    attributes:
      label: 时间区间
      description: 格式 YYYY-MM-DD 起，YYYY-MM-DD 止 / 至今。
      placeholder: 2024-01-01 起，2024-06-30 止
    validations:
      required: true

  - type: input
    id: people-involved
    attributes:
      label: 涉及人物（公开身份）
      description: 列出主要人物姓名与角色，多个用分号分隔。仅限公开身份。
      placeholder: 张三，XX 公司 CEO；李四，举报人
    validations:
      required: false

  - type: input
    id: orgs-involved
    attributes:
      label: 涉及机构
      description: 列出主要机构与角色，多个用分号分隔。
      placeholder: XX 上市公司；YY 监管机构
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: 摘要（一句话）
      description: 用一句话总结事件经过。
      placeholder: 2024 年 3 月，XX 公司被举报涉嫌财务造假……
    validations:
      required: true
      max_length: 500

  - type: textarea
    id: timeline
    attributes:
      label: 时间线（关键节点）
      description: |
        按时间顺序，每行一条：
        `YYYY-MM-DD：事件描述 [信源 URL]`
      placeholder: |
        2024-03-15：XX 公司发布 2023 年报，营收数据存疑 [https://example.com/a]
        2024-03-20：财经媒体发布调查报道 [https://example.com/b]
        2024-04-02：证监会立案调查 [https://example.com/c]
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 信源（必填，至少 2 条）
      description: |
        每条格式：`[标题](URL) - 媒体名 - 发布日期`
        一级信源（判决书 / 警方通报 / 政府公告）：单一信源即可入档
        二级信源（央视 / 新华社 / 财新 / 澎湃等）：至少 2 条
        三级信源（自媒体）：须明确标注"待交叉核实"，不可作为唯一依据
      placeholder: |
        1. [XX 公司被立案调查](https://example.com/a) - 新华社 - 2024-04-02
        2. [XX 财务造假调查报道](https://example.com/b) - 财新 - 2024-03-20
    validations:
      required: true

  - type: input
    id: submitter
    attributes:
      label: 投稿人
      description: 可选；填 GitHub 用户名 / 笔名 / 留空。
      placeholder: GitHub 用户名、笔名，或留空
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 其他说明（信源限制、保密要求、与其他事件关联等）。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我已阅读 [投稿指南](https://github.com/H-pony/evil-baike/blob/main/docs/CONTRIBUTING.md)，所提交事实均有可验证信源。
          required: true
        - label: 我同意本投稿以 CC BY-NC-SA 4.0 许可协议发布。
          required: true
        - label: 我知悉涉及未审结案件的内容将使用中性措辞，不作定性。
          required: true