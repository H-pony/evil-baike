name: Sync submissions from GitHub Issues

# ============================================================
# 每日把带 `submission` label 的 GitHub Issue 拉成本地
# Markdown 草稿，存到 src/content/_drafts/，commit & push 到 main。
#
# 主编后续：
#   1. 在 GitHub 上 review 每个 Issue
#   2. 本地 pull 后填字段、修改 status
#   3. 把草稿从 _drafts/ 移到 src/content/events/
#   4. 下次 push 触发 deploy 工作流发布
#
# 部署隔离：deploy.yml 已设置 paths-ignore: src/content/_drafts/**，
# 本工作流的 commit 不会触发部署。
# ============================================================

on:
  schedule:
    # 每天 UTC 09:00（北京时间 17:00）跑一次
    - cron: '0 9 * * *'
  workflow_dispatch:
    # 主编可手动触发（Settings → Actions → Sync submissions → Run workflow）

permissions:
  contents: write   # push commit 到 main
  issues: read      # 读 Issue

concurrency:
  group: sync-submissions
  cancel-in-progress: false

jobs:
  sync:
    name: Pull GitHub Issues → drafts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 push 权限
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 默认拉 submission label 的 open Issue；
          # 也可手动加参数 --label=correction / --label=takedown / --state=all
          node scripts/sync-submissions.mjs --source=github --label=submission

      - name: Check for changes
        id: check_changes
        run: |
          git add -A -- src/content/
          if git diff --cached --quiet -- src/content/_drafts/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push drafts
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "evil-baike-bot"
          git config user.email "bot@evil-baike.local"
          git commit -m "chore(sync): pull submissions from GitHub Issues

          Auto-generated by .github/workflows/sync-submissions.yml
          - Daily cron at 09:00 UTC
          - Filters: label=submission, state=open

          Skipped deploy via [skip deploy] in commit body."
          git push
          echo "✅ 推送完成"

      - name: No changes
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "ℹ️  没有新投稿，无需提交"
