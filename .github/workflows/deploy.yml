name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # 投稿聚合草稿：sync-submissions.yml 每天会 commit 到 main
      # 这些文件不进 Astro collections（src/content.config.ts 未注册 _drafts），
      # 所以触发 build 也不会改变 dist/，但能避免浪费 CF Pages 部署配额
      - 'src/content/_drafts/**'
      - '.github/workflows/sync-submissions.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_SUBMIT_GITHUB: https://github.com/H-pony/evil-baike/issues/new/choose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: ${{ vars.CF_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: evil-baike
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # 纯静态站点，无需 wrangler.toml
          # 高级路由 / Headers 在 Cloudflare 控制台或 _headers 文件里配

  deploy-preview:
    name: Deploy preview
    if: ${{ github.event_name == 'pull_request' && vars.CF_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy preview
        id: preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: evil-baike
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
