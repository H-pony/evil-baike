name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # 个人草稿不进 Astro collections。
      - 'src/content/_drafts/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type and interaction regressions
        run: npm run check && npm test

      - name: Validate content
        run: npm run validate

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Validate generated routes
        run: npm run validate -- --build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            functions
          retention-days: 5
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: ${{ vars.CF_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: evil-baike
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # dist 和根目录 functions/ 一起部署；D1 与 Secret 在 Pages 项目设置中绑定。

  deploy-preview:
    name: Deploy preview
    if: ${{ github.event_name == 'pull_request' && vars.CF_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy preview
        id: preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: evil-baike
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
